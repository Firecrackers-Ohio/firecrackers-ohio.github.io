name: Deploy to GitHub Pages

on:
  # Trigger the workflow every time you push to the `main` branch
  # Using a different branch name? Replace `main` with your branch’s name
  push:
    branches: [main]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:
  # Triggered by a webhook from Sanity when a coach or admin publishes a content
  # change. Sanity POSTs to https://api.github.com/repos/<owner>/<repo>/dispatches
  # with {"event_type": "sanity-publish"}. See docs/sanity-cms.md for setup.
  repository_dispatch:
    types: [sanity-publish]

# Read-only by default. The deploy job widens this for itself; the build job has
# no business holding deploy rights.
permissions:
  contents: read

# Publishes should queue rather than race — two in quick succession could
# otherwise finish out of order and leave the older build live. Deliberately not
# cancel-in-progress: a half-finished Pages deployment is worse than a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
      # withastro/action has no `node-version-file` input, only `node-version`,
      # so .nvmrc can't be handed to it directly the way the other workflows do
      # it. Reading the file into an output keeps the version defined in exactly
      # one place: bump .nvmrc and the deploy follows, instead of quietly
      # building on a different Node than CI checked.
      - name: Read the Node version from .nvmrc
        id: nvmrc
        run: echo "version=$(tr -d 'v[:space:]' < .nvmrc)" >> "$GITHUB_OUTPUT"
      - name: Install, build, and upload your site
        uses: withastro/action@v6
        with:
          node-version: ${{ steps.nvmrc.outputs.version }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # Lifted to job level so the notify step's `if` can check whether the
      # secrets exist. Without that guard, anyone without mail secrets
      # configured would get a failing deploy.
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # Emails you when a content publish reaches the live site, so you can
      # eyeball it. Only fires for Sanity-triggered deploys — pushes to main are
      # your own changes and don't need an alert. Skipped entirely if the mail
      # secrets aren't set. See docs/sanity-cms.md.
      - name: Email on content publish
        if: >-
          github.event_name == 'repository_dispatch' &&
          env.MAIL_USERNAME != '' &&
          env.MAIL_TO != ''
        # The site is already live by the time this runs. A bounced notification
        # is not a failed deploy, and marking the run red for one sends you
        # chasing a publish that actually worked.
        continue-on-error: true
        # Pinned to a commit rather than a tag: this is a third-party action and
        # the only one here that gets a secret, the SMTP password. A moving tag
        # means whoever controls it can change what runs with that password.
        uses: dawidd6/action-send-mail@94de994a9f6fffee200243214e17002e2920bb59 # v18
        with:
          server_address: ${{ secrets.MAIL_SERVER || 'smtp.gmail.com' }}
          server_port: ${{ secrets.MAIL_PORT || 465 }}
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          # Needs a real address, not just a display name: v3 accepted a bare
          # name, v18 rejects it. MAIL_USERNAME is the Gmail account this
          # authenticates as, so it's also the only sender Gmail will accept.
          from: Firecrackers Site <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: >-
            Firecrackers site updated${{
              github.event.client_payload.documentName
                && format(' — {0}', github.event.client_payload.documentName)
                || ''
            }}
          body: |
            Someone published a content change and the site has been rebuilt.

            What changed: ${{ github.event.client_payload.documentName || 'unknown — see the Studio' }}
            Type:         ${{ github.event.client_payload.documentType || 'unknown' }}

            Check it looks right:
              https://firecrackersohio.com/

            Edit in the Studio:
              https://firecrackersohio.sanity.studio/

            Build log:
              ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
